[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coderepair"
version = "0.1.0"
description = "A bounded autonomous Python code-repair agent with isolated test execution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CodeRepair contributors" }]
dependencies = [
  "anthropic>=2.0.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.17,<0.18",
]

[project.scripts]
coderepair = "coderepair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a local Docker daemon",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

